<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colection Cards Rick and Morty</title>
  <meta name="description" content="Cartas de colecionador de personagens de Rick and Morty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/decor.css">
  <link rel="stylesheet" href="css/portal-bg.css">
</head>
<body>

  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="portal-wobble-2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="1" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="portal-bg" aria-hidden="true">
    <div class="portal-bg__layer portal-bg__layer--1"></div>
    <div class="portal-bg__layer portal-bg__layer--2"></div>
    <div class="portal-bg__layer portal-bg__layer--3"></div>
    <div class="portal-bg__core"></div>
    <div class="portal-bg__speckles"></div>
  </div>

  <div class="portal portal--tl" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none">
      <path d="M100 90 A15 15 0 0 1 120 100 A25 25 0 0 1 100 130 A35 35 0 0 1 60 100 A45 45 0 0 1 100 50 A55 55 0 0 1 160 100 A65 65 0 0 1 100 170 A75 75 0 0 1 20 100" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="6" fill="currentColor"/>
    </svg>
  </div>

  <div class="portal portal--br" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none">
      <path d="M100 90 A15 15 0 0 1 120 100 A25 25 0 0 1 100 130 A35 35 0 0 1 60 100 A45 45 0 0 1 100 50 A55 55 0 0 1 160 100 A65 65 0 0 1 100 170 A75 75 0 0 1 20 100" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="6" fill="currentColor"/>
    </svg>
  </div>

  <main class="frame">
    <span class="sticker sticker--tr" aria-hidden="true">Wubba Lubba Dub Dub!</span>
    <span class="sticker sticker--bl" aria-hidden="true">Get Schwifty!</span>

    <header class="page-header">
      <p class="page-header__eyebrow">Rick and Morty</p>
      <h1 class="page-header__title">Colection Cards</h1>
      <p class="page-header__subtitle">Escolha uma carta e descubra o personagem</p>
    </header>

    <div class="filters" id="rarity-filters" role="group" aria-label="Filtrar por raridade">
      <button type="button" class="filter-chip is-active" data-rarity="all" aria-pressed="true">
        Todas <span class="filter-chip__count">0</span>
      </button>
      <button type="button" class="filter-chip filter-chip--legendary" data-rarity="legendary" aria-pressed="false">
        Lendária <span class="filter-chip__count">0</span>
      </button>
      <button type="button" class="filter-chip filter-chip--epic" data-rarity="epic" aria-pressed="false">
        Épica <span class="filter-chip__count">0</span>
      </button>
      <button type="button" class="filter-chip filter-chip--rare" data-rarity="rare" aria-pressed="false">
        Rara <span class="filter-chip__count">0</span>
      </button>
      <button type="button" class="filter-chip filter-chip--common" data-rarity="common" aria-pressed="false">
        Comum <span class="filter-chip__count">0</span>
      </button>
    </div>

    <section class="cards-grid" id="cards-grid" aria-label="Cartas de colecionador" aria-busy="true">
    </section>

    <p class="cards-status" id="cards-status" role="status" aria-live="polite">Carregando personagens...</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
