<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colection Cards Rick and Morty</title>
  <meta name="description" content="Cartas de colecionador de personagens de Rick and Morty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="frame">
    <header class="page-header">
      <p class="page-header__eyebrow">Rick and Morty</p>
      <h1 class="page-header__title">Colection Cards</h1>
      <p class="page-header__subtitle">Escolha uma carta e descubra o personagem</p>
    </header>

    <section class="cards-grid" aria-label="Cartas de colecionador">

      <article class="card">
        <div class="card__art">
          <span class="card__number">#001</span>
          <div class="card__portrait" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
            </svg>
          </div>
        </div>
        <div class="card__body">
          <h2 class="card__name">Rick Sanchez</h2>
          <p class="card__meta">Earth (C-137)</p>
          <div class="card__chips">
            <span class="chip chip--alive">Alive</span>
            <span class="chip">Human</span>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card__art">
          <span class="card__number">#002</span>
          <div class="card__portrait" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
            </svg>
          </div>
        </div>
        <div class="card__body">
          <h2 class="card__name">Morty Smith</h2>
          <p class="card__meta">Earth (C-137)</p>
          <div class="card__chips">
            <span class="chip chip--alive">Alive</span>
            <span class="chip">Human</span>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card__art">
          <span class="card__number">#003</span>
          <div class="card__portrait" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
            </svg>
          </div>
        </div>
        <div class="card__body">
          <h2 class="card__name">Summer Smith</h2>
          <p class="card__meta">Earth (Replacement Dimension)</p>
          <div class="card__chips">
            <span class="chip chip--alive">Alive</span>
            <span class="chip">Human</span>
          </div>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
