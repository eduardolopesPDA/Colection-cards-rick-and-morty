<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes | Colection Cards Rick and Morty</title>
  <meta name="description" content="Ficha do personagem de Rick and Morty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/portal-bg.css">
</head>
<body>

  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="portal-wobble-2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="1" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="portal-bg" aria-hidden="true">
    <div class="portal-bg__layer portal-bg__layer--1"></div>
    <div class="portal-bg__layer portal-bg__layer--2"></div>
    <div class="portal-bg__layer portal-bg__layer--3"></div>
    <div class="portal-bg__core"></div>
    <div class="portal-bg__speckles"></div>
  </div>

  <main class="frame details-frame">
    <a class="back-link" href="index.html">&larr; Voltar para as cartas</a>

    <div class="details" id="details" aria-busy="true"></div>

    <p class="cards-status" id="details-status" role="status" aria-live="polite">Carregando personagem...</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/detalhes.js"></script>
</body>
</html>
